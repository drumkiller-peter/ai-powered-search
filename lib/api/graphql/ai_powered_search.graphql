query AIPoweredSearch(
  $query: String!
  $type: String!
  $languages: [String!]
  $queryType: EGWQueryTypeEnum
  $orderBy: SortOrderEnum
  $filter: SearchInputFilterInput
  $limit: Int
  $offset: Int
) {
  search(
    query: $query
    type: $type
    languages: $languages
    queryType: $queryType
    orderBy: $orderBy
    filter: $filter
    limit: $limit
    offset: $offset
  ) {
    totalCount
    info {
      hasNextPage
      hasPreviousPage
    }
    items {
      weight
      answer
      snippet
      paraId
      publication {
        id
        title
        code
        languageCode
        isAudioBook
        folderId
        permission
        author {
          firstName
          lastName
          middleName
        }
        pageCount
      }
      paragraph {
        refCodes {
          short
        }
        chapterId
        paraId
        content
        metadata {
          date
          paraId
          bibleReference {
            book
            chapter
            verses
          }
        }
      }
    }
  }
}
